<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行首頁</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#0b1420; --panel:#111e2e; --panel-edge:#1c2c40;
    --amber:#f5a623; --teal:#2dd4bf; --red:#e5484d; --green:#3bd671; --muted:#6b7c8f; --text:#e8edf2;
  }
  body.light{
    --bg:#eef1f4; --panel:#ffffff; --panel-edge:#d8dee5;
    --amber:#c97a00; --teal:#0f8f82; --red:#c53030; --green:#1a9e52; --muted:#7c8895; --text:#0e1620;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,'Segoe UI',Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:22px 16px 50px; transition:background .3s, color .3s;
  }
  .topbar{ position:fixed; top:16px; right:16px; }
  .iconbtn{
    width:36px;height:36px;border-radius:50%;
    background:var(--panel); border:1px solid var(--panel-edge);
    color:var(--muted); display:flex;align-items:center;justify-content:center;
    font-size:16px; cursor:pointer;
  }
  .clock{ font-family:ui-monospace,'SF Mono',Consolas,monospace; font-size:13px; color:var(--muted); margin-bottom:16px; }

  /* ---- Tabs ---- */
  .tabs{ display:flex; gap:8px; margin-bottom:26px; background:var(--panel); border:1px solid var(--panel-edge); border-radius:12px; padding:5px; }
  .tab-btn{
    border:none; background:transparent; color:var(--muted); font-size:13px; font-weight:600;
    padding:9px 18px; border-radius:8px; cursor:pointer; transition:background .2s, color .2s;
    font-family:inherit;
  }
  .tab-btn.active{ background:var(--teal); color:#04211d; }

  .tab-content{ display:none; width:100%; max-width:760px; flex-direction:column; align-items:center; }
  .tab-content.active{ display:flex; }

  /* ---- Countdown ---- */
  .hero-label{ font-size:11px; letter-spacing:3px; color:var(--teal); text-transform:uppercase; margin-bottom:8px; }
  .hero-route{ font-size:15px; letter-spacing:1px; color:var(--muted); margin-bottom:18px; text-align:center; }
  .hero-route b{ color:var(--amber); font-size:18px; }
  .board{ display:flex; gap:8px; margin-bottom:26px; }
  .unit{display:flex; flex-direction:column; align-items:center;}
  .flip{
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:8px; padding:8px 4px;
    min-width:58px; text-align:center; font-family:ui-monospace,'SF Mono',Consolas,monospace;
    font-weight:700; font-size:32px; color:var(--amber); position:relative; overflow:hidden;
  }
  .flip::after{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--bg); opacity:.5; }
  .unit .label{ font-size:9px; letter-spacing:2px; color:var(--muted); margin-top:5px; text-transform:uppercase; }
  .colon{ font-size:26px; color:var(--panel-edge); align-self:center; margin-top:-12px; }
  .listwrap{ width:100%; max-width:400px; }
  .listwrap-title{ font-size:11px; letter-spacing:2px; color:var(--muted); margin:0 4px 8px; text-transform:uppercase; }
  .row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:10px; padding:12px 14px; margin-bottom:8px;
  }
  .row.done{ opacity:.45; }
  .row-route{ font-size:15px; font-weight:600; }
  .row-route span{ color:var(--muted); font-weight:400; margin:0 4px; }
  .row-meta{ font-size:11px; color:var(--muted); font-family:ui-monospace,'SF Mono',Consolas,monospace; }
  .row-right{ text-align:right; }
  .row-count{ font-size:15px; font-weight:700; color:var(--amber); font-family:ui-monospace,'SF Mono',Consolas,monospace; }
  .row.current .row-count{ color:var(--teal); }
  .row-tag{ font-size:9px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
  .row.done .row-count{ color:var(--muted); }

  /* ---- Earthquake ---- */
  #map{ width:100%; max-width:600px; height:300px; border-radius:14px; border:1px solid var(--panel-edge); margin-bottom:18px; overflow:hidden; }
  .leaflet-popup-content-wrapper{ background:var(--panel); color:var(--text); }
  .leaflet-popup-tip{ background:var(--panel); }
  .eq-row{
    display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; max-width:600px;
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:10px; padding:12px 16px; margin-bottom:8px;
  }
  .eq-mag{
    font-family:ui-monospace,'SF Mono',Consolas,monospace; font-size:20px; font-weight:700;
    width:50px; text-align:center; border-radius:8px; padding:4px 0; flex-shrink:0;
  }
  .eq-mag.m-low{ color:var(--muted); background:rgba(107,124,143,.12); }
  .eq-mag.m-mid{ color:var(--amber); background:rgba(245,166,35,.12); }
  .eq-mag.m-high{ color:var(--red); background:rgba(229,72,77,.15); }
  .eq-info{ flex:1; min-width:0; }
  .eq-place{ font-size:13px; font-weight:500; }
  .eq-time{ font-size:11px; color:var(--muted); font-family:ui-monospace,'SF Mono',Consolas,monospace; }
  .eq-depth{ font-size:11px; color:var(--muted); text-align:right; flex-shrink:0; }
  .eq-empty{ font-size:12px; color:var(--muted); text-align:center; padding:20px; }
  .eq-list{ width:100%; display:flex; flex-direction:column; align-items:center; }

  /* ---- Hotel ---- */
  .hotel-grid{ width:100%; max-width:600px; display:flex; flex-direction:column; gap:12px; }
  .hcard{
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:14px; padding:18px 20px;
    display:flex; align-items:center; gap:16px; cursor:pointer; text-decoration:none; color:inherit;
  }
  .hcard.current{ border-color:var(--teal); }
  .date-block{ flex-shrink:0; text-align:center; width:56px; font-family:ui-monospace,'SF Mono',Consolas,monospace; }
  .date-block .day{ font-size:24px; font-weight:700; color:var(--amber); line-height:1; }
  .date-block .month{ font-size:11px; color:var(--muted); margin-top:2px; }
  .hcard-mid{ flex:1; min-width:0; }
  .hcard-city{ font-size:11px; color:var(--teal); letter-spacing:1px; text-transform:uppercase; margin-bottom:3px; }
  .hcard-hotel{ font-size:15px; font-weight:600; margin-bottom:3px; }
  .hcard-addr{ font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hcard-nights{ font-size:11px; color:var(--muted); margin-top:4px; }
  .pin{ flex-shrink:0; font-size:20px; opacity:.6; }
  .tag-current{ font-size:10px; background:rgba(45,212,191,.15); color:var(--teal); padding:2px 8px; border-radius:10px; margin-left:8px; letter-spacing:.5px; }

  .footnote{ font-size:10px; color:var(--muted); text-align:center; margin-top:10px; }

  /* ---- Itinerary (Google Sheet) ---- */
  .day-card{
    width:100%; max-width:640px; background:var(--panel); border:1px solid var(--panel-edge);
    border-radius:14px; padding:18px 22px; margin-bottom:14px;
  }
  .day-title{ font-size:14px; font-weight:700; color:var(--teal); margin-bottom:12px; }
  .entry{ display:flex; gap:14px; padding:8px 0; border-top:1px solid var(--panel-edge); }
  .entry:first-of-type{ border-top:none; }
  .entry-time{ flex-shrink:0; width:74px; font-family:ui-monospace,'SF Mono',Consolas,monospace; font-size:12px; color:var(--amber); }
  .entry-mid{ flex:1; min-width:0; }
  .entry-place{ font-size:13px; font-weight:500; }
  .entry-note{ font-size:11px; color:var(--muted); margin-top:2px; white-space:pre-line; }
  .entry-hotel{ font-size:11px; color:var(--teal); margin-top:4px; }
  .entry-hotel::before{ content:"🏨 "; }

  @media (max-width:380px){
    .flip{ min-width:46px; font-size:24px; padding:7px 3px; }
    .colon{ font-size:20px; }
  }
</style>
</head>
<body>

<div class="topbar"><div class="iconbtn" id="themeToggle">◐</div></div>

<div class="clock" id="clock">--:--:--</div>

<nav class="tabs">
  <button class="tab-btn active" data-tab="countdown">✈️ 倒數</button>
  <button class="tab-btn" data-tab="quake">🌏 地震</button>
  <button class="tab-btn" data-tab="hotel">🏨 酒店</button>
  <button class="tab-btn" data-tab="itin">📋 行程</button>
</nav>

<!-- ===== 倒數 Tab ===== -->
<div class="tab-content active" id="tab-countdown">
  <div class="hero-label" id="heroLabel">下一程</div>
  <div class="hero-route" id="heroRoute"><b>—</b></div>
  <div class="board" id="board">
    <div class="unit"><div class="flip" id="d">00</div><div class="label">日</div></div>
    <div class="colon">:</div>
    <div class="unit"><div class="flip" id="h">00</div><div class="label">時</div></div>
    <div class="colon">:</div>
    <div class="unit"><div class="flip" id="m">00</div><div class="label">分</div></div>
    <div class="colon">:</div>
    <div class="unit"><div class="flip" id="s">00</div><div class="label">秒</div></div>
  </div>
  <div class="listwrap">
    <div class="listwrap-title">全程航班</div>
    <div id="rows"></div>
  </div>
</div>

<!-- ===== 地震 Tab ===== -->
<div class="tab-content" id="tab-quake">
  <div id="map"></div>
  <div class="eq-list" id="eqList"><div class="eq-empty">載入中…</div></div>
  <div class="footnote">資料來源: USGS 全球地震監測 (免費公開 API) · 每5分鐘自動更新 · 過去7日 M2.5+</div>
</div>

<!-- ===== 酒店 Tab ===== -->
<div class="tab-content" id="tab-hotel">
  <div class="hotel-grid" id="hotelGrid"></div>
  <div class="footnote" id="hotelSynced"></div>
</div>

<!-- ===== 行程 Tab (即時讀 Google Sheet) ===== -->
<div class="tab-content" id="tab-itin">
  <div id="itinList" style="width:100%; display:flex; flex-direction:column; align-items:center;">
    <div class="eq-empty">載入中…</div>
  </div>
  <div class="footnote" id="itinFootnote">資料來源: Google Sheet (即時讀取) · 撳分頁自動更新</div>
</div>

<script src="data.js"></script>
<script>
  // ================= 通用 =================
  function pad(n){ return String(n).padStart(2,'0'); }
  function tick(){
    document.getElementById('clock').textContent = new Date().toLocaleString('zh-HK', {hour12:false});
  }
  setInterval(tick, 1000); tick();

  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('light');
    themeToggle.textContent = document.body.classList.contains('light') ? '◑' : '◐';
  });

  // ================= Tabs =================
  const tabBtns = document.querySelectorAll('.tab-btn');
  const tabContents = document.querySelectorAll('.tab-content');
  let mapInited = false;

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');

      if (btn.dataset.tab === 'quake'){
        if (!mapInited){ initMap(); mapInited = true; loadEarthquakes(); }
        setTimeout(() => map && map.invalidateSize(), 50);
      }
      if (btn.dataset.tab === 'itin'){
        loadItinerary();
      }
    });
  });

  // ================= 倒數邏輯 =================
  function diffParts(ms){
    if (ms < 0) ms = 0;
    const d = Math.floor(ms / 86400000);
    const h = Math.floor((ms % 86400000) / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    return {d,h,m,s};
  }

  function renderRows(now){
    const wrap = document.getElementById('rows');
    wrap.innerHTML = '';
    let nextIdx = LEGS.findIndex(l => l.date - now > 0);

    LEGS.forEach((l, i) => {
      const diff = l.date - now;
      const isDone = diff <= 0;
      const isCurrent = i === nextIdx;
      const row = document.createElement('div');
      row.className = 'row' + (isDone ? ' done' : '') + (isCurrent ? ' current' : '');
      const dateStr = l.date.toLocaleDateString('zh-HK', {month:'2-digit', day:'2-digit'}) + ' ' +
                      l.date.toLocaleTimeString('zh-HK', {hour:'2-digit', minute:'2-digit', hour12:false});
      let countStr, tagText;
      if (isDone){ countStr = '✓'; tagText = '已完成'; }
      else {
        const p = diffParts(diff);
        countStr = p.d > 0 ? `${p.d}日 ${pad(p.h)}:${pad(p.m)}` : `${pad(p.h)}:${pad(p.m)}:${pad(p.s)}`;
        tagText = isCurrent ? '下一程' : '尚未起飛';
      }
      row.innerHTML = `
        <div class="row-left">
          <div class="row-route">${l.from}<span>→</span>${l.to}</div>
          <div class="row-meta">${l.code} · ${dateStr} · ${l.note}</div>
        </div>
        <div class="row-right"><div class="row-count">${countStr}</div><div class="row-tag">${tagText}</div></div>`;
      wrap.appendChild(row);
    });
    return nextIdx;
  }

  function tickCountdown(){
    const now = new Date();
    const nextIdx = renderRows(now);
    if (nextIdx === -1){
      document.getElementById('heroLabel').textContent = '全部航段已完成';
      document.getElementById('heroRoute').innerHTML = '<b>歡迎返嚟 👋</b>';
      ['d','h','m','s'].forEach(id => document.getElementById(id).textContent = '00');
      return;
    }
    const leg = LEGS[nextIdx];
    document.getElementById('heroLabel').textContent = nextIdx === 0 ? '出發倒數' : '下一程倒數';
    document.getElementById('heroRoute').innerHTML =
      `<b>${leg.from} → ${leg.to}</b> &nbsp;·&nbsp; ${leg.code} &nbsp;·&nbsp; ${leg.date.toLocaleDateString('zh-HK',{month:'2-digit',day:'2-digit'})} ${leg.date.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false})}`;
    const p = diffParts(leg.date - now);
    document.getElementById('d').textContent = pad(p.d);
    document.getElementById('h').textContent = pad(p.h);
    document.getElementById('m').textContent = pad(p.m);
    document.getElementById('s').textContent = pad(p.s);
  }
  setInterval(tickCountdown, 1000);
  tickCountdown();

  // ================= 地震邏輯 =================
  const DIR_MAP = { N:'北', S:'南', E:'東', W:'西', NE:'東北', NW:'西北', SE:'東南', SW:'西南',
    NNE:'北北東', ENE:'東北東', ESE:'東南東', SSE:'南南東', SSW:'南南西', WSW:'西南西', WNW:'西北西', NNW:'北北西' };
  const PLACE_MAP = {
    'Kumamoto':'熊本','Kagoshima':'鹿兒島','Miyazaki':'宮崎','Oita':'大分','Fukuoka':'福岡','Nagasaki':'長崎',
    'Saga':'佐賀','Yatsushiro':'八代','Amakusa':'天草','Aso':'阿蘇','Beppu':'別府','Miyakonojo':'都城',
    'Nobeoka':'延岡','Hyuga':'日向','Kirishima':'霧島','Ebino':'えびの','Hitoyoshi':'人吉','Minamata':'水俣',
    'Sasebo':'佐世保','Kitakyushu':'北九州','Tanegashima':'種子島','Yakushima':'屋久島','Amami':'奄美',
    'Okinawa':'沖繩','Kyushu':'九州','Bungo Channel':'豐後水道','Hyuganada Sea':'日向灘',
    'Satsuma Peninsula':'薩摩半島','Japan':'日本','Honmachi':'本町','Mifune':'御船','Uki':'宇城',
    'Tsunagi':'津奈木','Uto':'宇土','Mashiki':'益城','Kashima':'嘉島','Kikuchi':'菊池','Tamana':'玉名',
    'Arao':'荒尾','Koshi':'合志','Nagasu':'長洲','Ozu':'大津','Kikuyo':'菊陽','Earthquake':'地震'
  };
  const PLACE_MAP_KEYS = Object.keys(PLACE_MAP).sort((a,b) => b.length - a.length);

  function translatePlace(str){
    if (!str) return str;
    const m = str.match(/^(\d+)\s*km\s+([NSEW]{1,3})\s+of\s+(.+?)(,\s*Japan)?$/i);
    if (m){
      const dist = m[1];
      const dir = DIR_MAP[m[2].toUpperCase()] || m[2];
      const place = m[3].replace(/,\s*Japan$/i, '').trim();
      const placeCn = PLACE_MAP[place] || place;
      return `${placeCn}${dir}方${dist}公里`;
    }
    let out = str;
    PLACE_MAP_KEYS.forEach(k => { out = out.replace(new RegExp(k, 'gi'), PLACE_MAP[k]); });
    return out;
  }

  let map, markersLayer;
  function initMap(){
    map = L.map('map', { zoomControl:true }).setView([32.0, 131.0], 7);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO', maxZoom: 18
    }).addTo(map);
    markersLayer = L.layerGroup().addTo(map);
  }

  function renderMapMarkers(features){
    markersLayer.clearLayers();
    features.forEach(f => {
      const p = f.properties;
      const coords = f.geometry.coordinates;
      const mag = p.mag;
      const color = mag >= 5 ? '#e5484d' : (mag >= 4 ? '#f5a623' : '#6b7c8f');
      const radius = 4 + mag * 2.2;
      const marker = L.circleMarker([coords[1], coords[0]], { radius, color, fillColor: color, fillOpacity: 0.55, weight: 1 });
      const time = new Date(p.time).toLocaleString('zh-HK', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false});
      marker.bindPopup(`<b>M${mag.toFixed(1)}</b><br>${translatePlace(p.place)}<br>${time}`);
      marker.addTo(markersLayer);
    });
  }

  function renderEqList(features){
    const list = document.getElementById('eqList');
    if (!features || features.length === 0){
      list.innerHTML = '<div class="eq-empty">過去7日冇 M2.5+ 地震記錄</div>';
      return;
    }
    list.innerHTML = '';
    features.forEach(f => {
      const p = f.properties;
      const mag = p.mag;
      const magClass = mag >= 5 ? 'm-high' : (mag >= 4 ? 'm-mid' : 'm-low');
      const time = new Date(p.time).toLocaleString('zh-HK', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false});
      const depth = f.geometry.coordinates[2];
      const row = document.createElement('div');
      row.className = 'eq-row';
      row.innerHTML = `
        <div class="eq-mag ${magClass}">M${mag.toFixed(1)}</div>
        <div class="eq-info"><div class="eq-place">${translatePlace(p.place)}</div><div class="eq-time">${time}</div></div>
        <div class="eq-depth">深度<br>${depth ? depth.toFixed(0) : '?'}km</div>`;
      list.appendChild(row);
    });
  }

  async function loadEarthquakes(){
    try{
      const start = new Date(Date.now() - 7*86400000).toISOString().slice(0,10);
      const url = `https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&minmagnitude=2.5&starttime=${start}&minlatitude=29.5&maxlatitude=34&minlongitude=128.5&maxlongitude=132.5&orderby=time&limit=20`;
      const res = await fetch(url);
      const data = await res.json();
      renderEqList(data.features);
      renderMapMarkers(data.features);
    }catch(e){
      document.getElementById('eqList').innerHTML = '<div class="eq-empty">無法載入, 檢查網絡連線</div>';
    }
  }
  setInterval(() => { if (mapInited) loadEarthquakes(); }, 5 * 60 * 1000);

  // ================= 酒店邏輯 =================
  function daysBetween(a, b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }

  function renderHotels(){
    document.getElementById('hotelSynced').textContent = '更新於: ' + HOTELS.last_updated;
    const grid = document.getElementById('hotelGrid');
    grid.innerHTML = '';
    const now = new Date(); now.setHours(0,0,0,0);

    HOTELS.items.forEach(hh => {
      const checkin = new Date(hh.checkin);
      const checkout = new Date(hh.checkout);
      const isCurrent = now >= checkin && now < checkout;
      const nights = daysBetween(hh.checkin, hh.checkout);
      const mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(hh.address);

      const card = document.createElement('a');
      card.href = mapUrl; card.target = '_blank'; card.rel = 'noopener';
      card.className = 'hcard' + (isCurrent ? ' current' : '');
      card.innerHTML = `
        <div class="date-block"><div class="day">${checkin.getDate()}</div><div class="month">${checkin.toLocaleDateString('zh-HK',{month:'short'})}</div></div>
        <div class="hcard-mid">
          <div class="hcard-city">${hh.city}${isCurrent ? '<span class="tag-current">住緊</span>' : ''}</div>
          <div class="hcard-hotel">${hh.hotel_name}</div>
          <div class="hcard-addr">${hh.address}</div>
          <div class="hcard-nights">${hh.checkin} → ${hh.checkout} · ${nights}晚${hh.confirmation ? ' · Conf# ' + hh.confirmation : ''}</div>
        </div>
        <div class="pin">📍</div>`;
      grid.appendChild(card);
    });
  }
  renderHotels();

  // ================= 自動 reload (讀返 data.js 最新內容) =================
  setInterval(() => location.reload(), 60000);

  // ================= 行程 (即時讀 Google Sheet) =================
  // 你張表: https://docs.google.com/spreadsheets/d/1PRykWKgheRs_eJI0non5rDBRS4q0rlVDUcQJMzUooOo
  // 用分頁名嚟指定嗰頁, 如果之後個分頁改名, 要同步改返呢度個字串
  const SHEET_ID = '1PRykWKgheRs_eJI0non5rDBRS4q0rlVDUcQJMzUooOo';
  const SHEET_NAME = '最新VER.__有宮崎版本 1';
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

  async function loadItinerary(){
    const list = document.getElementById('itinList');
    try{
      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error('fetch failed');
      const csvText = await res.text();
      const parsed = Papa.parse(csvText.trim(), { skipEmptyLines:'greedy' });
      renderItinerary(parsed.data);
      document.getElementById('itinFootnote').textContent =
        '資料來源: Google Sheet (即時讀取) · 更新於 ' + new Date().toLocaleTimeString('zh-HK',{hour12:false});
    }catch(e){
      list.innerHTML = '<div class="eq-empty">無法讀取 Google Sheet, 檢查網絡連線 或者 張表分享設定</div>';
    }
  }

  function renderItinerary(rows){
    const list = document.getElementById('itinList');
    list.innerHTML = '';

    const days = [];
    let currentDay = null;
    let lastDate = '';

    // rows[0] 係 header (日期/時間/地點/車程備忘/住宿), 由 rows[1] 開始先係資料
    for (let i = 1; i < rows.length; i++){
      const row = rows[i];
      const date = (row[0] || '').trim();
      const time = (row[1] || '').trim();
      const place = (row[2] || '').trim();
      const note = (row[3] || '').trim();
      const hotel = (row[4] || '').trim();

      if (!date && !time && !place && !note && !hotel) continue; // 完全空行skip

      if (date){
        lastDate = date;
        currentDay = { date: lastDate, entries: [] };
        days.push(currentDay);
      }
      if (!currentDay){
        currentDay = { date: lastDate || '未分類', entries: [] };
        days.push(currentDay);
      }
      if (place || note || hotel){
        currentDay.entries.push({ time, place, note, hotel });
      }
    }

    if (days.length === 0){
      list.innerHTML = '<div class="eq-empty">張表暫時冇資料, 或者欄位次序同預期唔同</div>';
      return;
    }

    days.forEach(d => {
      const card = document.createElement('div');
      card.className = 'day-card';
      let entriesHtml = '';
      d.entries.forEach(en => {
        entriesHtml += `
          <div class="entry">
            <div class="entry-time">${en.time}</div>
            <div class="entry-mid">
              <div class="entry-place">${en.place}</div>
              ${en.note ? '<div class="entry-note">' + en.note + '</div>' : ''}
              ${en.hotel ? '<div class="entry-hotel">' + en.hotel + '</div>' : ''}
            </div>
          </div>`;
      });
      card.innerHTML = `<div class="day-title">${d.date}</div>${entriesHtml}`;
      list.appendChild(card);
    });
  }
</script>

</body>
</html>
